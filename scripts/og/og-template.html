<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Archivo';
        src: url('../../public/fonts/archivo-var.woff2') format('woff2-variations');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Spline Sans Mono';
        src: url('../../public/fonts/spline-mono.woff2') format('woff2-variations');
        font-weight: 400 700;
      }
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: #080b0c;
        color: #eef3f1;
        font-family: 'Archivo', 'Noto Sans SC', sans-serif;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 56px 64px;
        position: relative;
        overflow: hidden;
      }
      body::after {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(90% 70% at 78% -10%, rgba(255, 122, 47, 0.16), transparent 62%),
          linear-gradient(rgba(233, 240, 238, 0.045) 1px, transparent 1px) 0 0 / 100% 34px;
        pointer-events: none;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 22px;
        font-weight: 680;
        letter-spacing: -0.02em;
        z-index: 1;
      }
      .mark {
        display: grid;
        grid-template-columns: repeat(2, 9px);
        gap: 3px;
      }
      .mark i { width: 9px; height: 9px; background: #ff7a2f; display: block; }
      .mark i:nth-child(4) { background: #4a5553; }
      .tld { color: #ff7a2f; }
      .mid { align-self: center; z-index: 1; display: grid; gap: 20px; }
      h1 {
        font-size: 76px;
        line-height: 0.98;
        letter-spacing: -0.045em;
        font-weight: 700;
        font-stretch: 88%;
        max-width: 15ch;
      }
      h1 em { font-style: normal; color: #ff7a2f; }
      p {
        font-size: 23px;
        color: #bcc7c3;
        max-width: 34ch;
        line-height: 1.5;
      }
      .bot {
        display: flex;
        align-items: center;
        gap: 28px;
        font-family: 'Spline Sans Mono', monospace;
        font-size: 17px;
        color: #96a29e;
        border-top: 1px solid rgba(233, 240, 238, 0.16);
        padding-top: 22px;
        z-index: 1;
      }
      .bot b { color: #eef3f1; font-weight: 500; }
      .bot span:last-child { margin-left: auto; color: #ff7a2f; }
    </style>
  </head>
  <body>
    <div class="top">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span>tzixi<span class="tld">.cn</span></span>
    </div>
    <div class="mid">
      <h1>我写的<em>模组</em>，和我调好的<em>光影</em>。</h1>
      <p>按加载器和游戏版本挑，点开就是文件本身。</p>
    </div>
    <div class="bot">
      <span><b>4</b> 个模组</span>
      <span><b>3</b> 套光影参数</span>
      <span>Fabric · NeoForge · Iris</span>
      <span>tzixi.cn</span>
    </div>
  </body>
</html>
