.lib-tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; }

}
.lib-chip:hover { transform: translateY(-1px); border-color: rgba(16, 16, 16, 0.3); }
.lib-chip[aria-pressed="true"] { background: #101010; border-color: #101010; color: #fff; }

.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 18px; margin: 0 0 64px; }

  padding: 24px 26px 26px;
  min-height: 168px;
  border-radius: 26px;
  text-decoration: none;
  color: var(--ink);
  transition: transform 0.6s var(--ease-jelly), border-radius 0.6s var(--ease-jelly);
}
.lib-card:hover, .lib-card:focus-visible {
  transform: translateY(-4px);
  border-radius: 32px 38px 34px 40px / 38px 32px 40px 34px;
}
.lib-card__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-en);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--muted);
}
.lib-card__badge {
  border: 1px solid rgba(10, 10, 10, 0.16);
  border-radius: 999px;
  padding: 3px 9px;
  font-size: 9px;
  letter-spacing: 0.1em;
}
.lib-card__body { display: flex; align-items: center; gap: 18px; margin: 6px 0 26px; }
.lib-card__thumb {

  flex: 0 0 74px;
  border-radius: 18px;
  overflow: hidden;
  background: rgba(10, 10, 10, 0.04);
}
.lib-card__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lib-card__text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lib-card__zh { font-family: var(--font-zh); font-size: 30px; letter-spacing: 0.04em; line-height: 1.25; }
.lib-card__en { font-family: var(--font-en); font-size: 11px; letter-spacing: 0.14em; color: var(--muted); }
.lib-card__go { position: absolute; right: 24px; bottom: 24px; font-family: var(--font-en); font-size: 13px; opacity: 0.4; transition: transform 0.5s var(--ease-jelly), opacity 0.4s; }
.lib-card:hover .lib-card__go { transform: translateX(4px); opacity: 0.9; }
.lib-card { animation: lib-in 0.7s var(--ease-jelly) backwards; }
.lib-card:nth-child(1) { animation-delay: 0.04s; }
.lib-card:nth-child(2) { animation-delay: 0.1s; }
.lib-card:nth-child(3) { animation-delay: 0.16s; }
.lib-card:nth-child(4) { animation-delay: 0.22s; }
.lib-card:nth-child(5) { animation-delay: 0.28s; }
.lib-card:nth-child(6) { animation-delay: 0.34s; }
@keyframes lib-in {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .lib-card { animation: none; }
}
.lib-empty { font-size: 15px; line-height: 1.9; color: var(--muted); margin: 0 0 64px; }

  <script src="../assets/article.js" defer></script>
  <script>
  (function () {
    var q = document.getElementById('libq');
    var c = document.getElementById('libc');
    var none = document.getElementById('libnone');
    var sort = document.getElementById('libsort');
    var tagBox = document.getElementById('libtags');
    var grid = document.querySelector('.lib-grid');
    var cards = [].slice.call(document.querySelectorAll('.lib-card'));
    var total = cards.length;
    var tag = '';

    /* 缩略图：加载完成后淡入（底色已经是主色，不会先白一块） */
    cards.forEach(function (el) {
      var img = el.querySelector('.lib-card__thumb img');
      if (!img) return;
      if (img.complete) img.classList.add('on');
      else img.addEventListener('load', function () { img.classList.add('on'); });
      img.addEventListener('error', function () { img.style.opacity = '0'; });
    });

    function apply() {
      var s = String(q.value || '').trim().toLowerCase();
      var n = 0;
      cards.forEach(function (el) {
        var hay = el.getAttribute('data-s') || '';
        var py = el.getAttribute('data-py') || '';
        var tags = el.getAttribute('data-tags') || '';
        var hitQ = !s || hay.indexOf(s) >= 0 || (py && py.indexOf(s) >= 0);
        var hitT = !tag || tags.split('|').indexOf(tag) >= 0;
        var hit = hitQ && hitT;
        el.hidden = !hit;
        if (hit) n++;
      });
      c.textContent = (s || tag) ? n + ' / ' + total + ' 个页面' : total + ' 个页面';
      if (none) none.hidden = n !== 0;
    }

    function resort() {
      var mode = sort ? sort.value : 'new';
      var list = cards.slice().sort(function (a, b) {
        if (mode === 'name') {
          return (a.getAttribute('data-name') || '').localeCompare(b.getAttribute('data-name') || '', 'zh');
        }
        return Number(b.getAttribute('data-mt') || 0) - Number(a.getAttribute('data-mt') || 0);
      });
      list.forEach(function (el) { grid.appendChild(el); });
    }

    q.addEventListener('input', apply);
    sort && sort.addEventListener('change', resort);
    if (tagBox) {
      tagBox.addEventListener('click', function (e) {
        var btn = e.target.closest('.lib-chip');
        if (!btn) return;
        tag = btn.getAttribute('data-tag') || '';
        Array.prototype.forEach.call(tagBox.querySelectorAll('.lib-chip'), function (b) {
          b.setAttribute('aria-pressed', String((b.getAttribute('data-tag') || '') === tag));
        });
        apply();
      });
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
      if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; apply(); q.blur(); }
    });
    resort();
    apply();
  })();
  </script>
